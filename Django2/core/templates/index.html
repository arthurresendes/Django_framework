{% load bootstrap4 %}
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    {% bootstrap_css %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Produtos</h1>
        <table class="table table-success">
            <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Quantidade</th>
                </tr>
            </thead>
            <tbody>
                {% for produto in produtos %}
                    <tr>
                        <td scope="row">{{produto.id}}</td>
                        <td scope="row"><a href="#modal{{produto.id}}" data-toggle="modal">{{produto.nome}}</a></td>
                        <td scope="row">{{produto.preco}}</td>
                        <td scope="row">{{produto.quantidade}}</td>
                    </tr>
                    <div class="modal fade bd-example-modal.lg show" id="modal{{produto.id}}" role="dialog">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">{{ produto.nome }}</h5>
                                    <button type="button" class="close" data-dismiss="modal"><span class="aria-hidden">&times;</span></button>
                                </div>
                                <div class="modal-body" id="dynamic-content">
                                    <img src="{{produto.imagem.url}}" class="img-fluid" alt="{{produto.nome}}">
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% bootstrap_javascript jquery='full' %}
</body>
</html>
