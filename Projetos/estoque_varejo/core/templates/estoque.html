{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BOOTSTRAP 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Estoque</title>
    <script src="{% static 'js/main.js' %}"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Detalhes do Estoque</h1>

        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover align-middle">
                <thead class="table-info">
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Promoção</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <a href="{% url 'index' %}" class="text-decoration-none">
                                {{ est.nome }}
                            </a>
                        </td>
                        <td><strong>R$ {{ est.preco }}</strong></td>
                        <td>
                            <span class="badge bg-primary">{{ est.quantidade }} unidades</span>
                        </td>
                        <td>
                            {% if est.promocao %}
                                <span class="badge bg-success">Sim</span>
                            {% else %}
                                <span class="badge bg-secondary">Não</span>
                            {% endif %}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- BOTÕES DE AÇÃO -->
        <div class="d-flex gap-2 justify-content-center mt-4">
            <button onclick="data_atual()" class="btn btn-warning btn-lg">
                📅 Ver Data Atual
            </button>
            <a href="{% url 'index' %}" class="btn btn-secondary btn-lg">
                ← Voltar
            </a>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
